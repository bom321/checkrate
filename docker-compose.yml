services:
  checkrate:
    build: .
    container_name: checkrate
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      - TZ=Asia/Bangkok
      - DATA_DIR=/data
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      # host path ปรับได้ผ่าน HOST_DATA_DIR ใน .env (ค่าเริ่มต้น /volume1/checkrate — ตั้งเองก่อน deploy จริง)
      - "${HOST_DATA_DIR:-/volume1/checkrate}:/data"
